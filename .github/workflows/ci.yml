name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    if: >-
      ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true
          components: clippy,rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Require maintainer approval before running CI
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = github.event.pull_request;
            if (!pr) {
              throw new Error('Pull request data is missing.');
            }

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const approvedReviews = reviews.data.filter(
              (review) => review.state === 'APPROVED' && review.user?.login,
            );

            for (const review of approvedReviews) {
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: review.user.login,
              });

              if (['admin', 'maintain', 'write'].includes(permission.data.permission)) {
                core.info(`Maintainer approval found from ${review.user.login}.`);
                return;
              }
            }

            throw new Error(
              'CI for pull requests targeting main only runs after approval by a maintainer.',
            );

      - name: Build
        run: cargo build --locked --verbose

      - name: Run Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run Rustfmt check
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked --verbose
